# Issue intake: one queue.
#
# The templates label themselves, so a report that used a form arrives with
# its kind and its area already on it. This workflow covers the one case the
# templates do not: an issue opened without a form. It gets the same triage
# label, so nothing sits unseen because it skipped the intake.
#
# It grants one permission — issues: write — and nothing else: no contents,
# no packages, no secrets.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Put the issue in the triage queue
        uses: actions/github-script@v7
        with:
          script: |
            // `context` is the workflow context; `github` is the API client.
            // The issue is read from the API rather than from the event
            // payload: the payload's label list is not always populated, and
            // the question here is only whether `triage` is already on.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: number,
            });
            const labels = new Set(issue.labels.map((l) => l.name));
            if (!labels.has('triage')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: ['triage'],
              });
            }
