name: CI

# Fork-safe by construction: the only permission granted is `contents: read`,
# no job here references a secret, and nothing here grants `contents: write`.
# The old repo's android.yml broke every outside contributor's PR because the
# APK job fetched the signing secret during pull_request; that job lives in
# release.yml now, and only runs on upstream tags.
#
# scripts/gate.sh is the single authoritative list of checks — the local gate
# and the CI gate are the same command.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins stable + rustfmt + clippy; rustup installs them.
      - run: bash scripts/gate.sh

  # The scanners above look at the tree. This one looks at the *change*: the
  # lines a pull request adds. A leak is introduced by a commit, so the commit
  # is where it has to be caught — before it can be merged, and before it is
  # ever seen by anyone but the reviewer.
  #
  # Fork-safe: it reads the diff, needs no secret, and grants nothing.
  pr-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the base branch, not just the tip.
          fetch-depth: 0
      - name: Scan the change for credentials, personal data and unexplained dependencies
        run: bash scripts/scan-pr.sh origin/master HEAD
