[package]
name = "stride-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# gzip. `flate2` with the pure-Rust backend: no C library, so the Android
# NDK build has nothing extra to link. It is already in the workspace's
# lock file (reqwest's gzip feature pulls it in), so this adds no new crate
# to the graph.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The map tiles are fetched over HTTPS. `reqwest` is in the approved set and
# is already in the graph — `stride-garmin` uses it for the Garmin API — so
# this adds no new crate and no new code to the binaries.
reqwest = { workspace = true }
# The SHA-256 that a device token's hash is made with. `ring` is already in
# the workspace's lock file (rustls's TLS stack pulls it in), so this adds no
# new crate to the graph — and the reference hashes the token with SHA-256
# too, so the two agree.
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
stride-core = { path = "../stride-core" }
stride-fit = { path = "../stride-fit" }
stride-garmin = { path = "../stride-garmin" }
stride-store = { path = "../stride-store" }

[lints]
workspace = true
