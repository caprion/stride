# The phone's Rust core, behind UniFFI.
#
# It is a member of the root workspace, so `cargo test --workspace` and the
# gate cover it: one command, one answer about the whole system.
#
# The Android build needs a `cdylib` for `aarch64-linux-android`, and the
# release profile comes from the root manifest (`opt-level = "z"`, `lto`,
# `codegen-units = 1`, `strip = true`, and `panic = "unwind"`, so a panic in
# the library is an error the app can show rather than a process kill).
#
# The dependencies are the ones the contract approves (`serde_json`,
# `uniffi`) plus the shared crates, and `chrono` for the tests. No new
# third-party dependency is introduced here.

[package]
name = "stride-ffi"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "The UniFFI surface the Android shell calls: one entry point, plus the setup the phone has to do once."

[lib]
# `cdylib` is what the APK packages; `rlib` is what the tests link.
crate-type = ["cdylib", "staticlib", "rlib"]
# The file name is `libuniffi_stride.so`, because UniFFI's Kotlin bindings
# load the library by the namespace's name (`uniffi_stride`).
name = "uniffi_stride"

[build-dependencies]
# The scaffolding generator runs in the build script, so it is a build
# dependency as well as a normal one.
uniffi = { version = "0.29", features = ["build"] }

[dependencies]
serde_json = "1"
uniffi = { version = "0.29", features = ["build"] }

# `chrono` is in the approved dependency set (docs/rust-core-spec.md). The
# shell needs it for one thing: the timestamp of a pull, which goes into the
# sync log in the phone's own database and into `last_sync_at`. The version
# is the one the workspace already pins, so nothing new is downloaded.
chrono = { version = "0.4", features = ["serde"] }

# The shared crates. The paths are relative to this file.
stride-api = { path = "../../../../../../crates/stride-api" }
stride-store = { path = "../../../../../../crates/stride-store" }

# The workspace's lints: no unwrap, no expect, no panic, and `unsafe` only
# where the FFI needs it — which, here, is nowhere. The phone's crate calls
# the safe Rust API above `crates/stride-api/src/ffi.rs`.
[lints]
workspace = true
