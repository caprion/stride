apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// ---------------------------------------------------------------------------
// The Rust core.
//
// The phone runs the Rust core **in this process**: `cargo-ndk` cross-compiles
// it for `aarch64-linux-android`, the UniFFI scaffolding generates the Kotlin
// bindings from the UDL, and the shared object is packaged as
// `libuniffi_stride.so`.
//
// **The core is not optional.** A release APK without the core is not Stride,
// so the release build refuses to be assembled without it. A debug build may
// be assembled without it, and says so loudly — see `rustCoreMode` below.
// ---------------------------------------------------------------------------

/**
 * The ABIs this build carries.
 *
 * **arm64-v8a only**, which is what ships: almost every phone in use is
 * arm64, and the release APK has to stay small. The x86_64 variant exists
 * for the emulator and is never published:
 *
 *     ./gradlew :app:assembleDebug -PstrideEmulatorAbi=x86_64
 */
def targetAbis = project.hasProperty('strideEmulatorAbi')
        ? [project.strideEmulatorAbi]
        : ['arm64-v8a']

/** The Rust crate of the phone. */
def rustCrateDir = file('src/main/rust/stride-ffi')

/** The binding generator: a build tool next to the crate. */
def rustBindgenDir = file('src/main/rust/stride-bindgen')

/** Where the generated Kotlin bindings go. */
def uniffiGeneratedDir = layout.buildDirectory.dir('generated/uniffi/kotlin')

/** Where the shared object is staged for the APK. */
def rustJniLibsDir = layout.buildDirectory.dir('rust/jniLibs')

/** The repository root: the Gradle root is `android/`, one level below it. */
def rustWorkspaceDir = rootProject.projectDir.parentFile

/**
 * The Rust target triple of an ABI.
 *
 * `cargo-ndk` builds into `target/<triple>/release`, and the triple is not
 * the ABI name: `arm64-v8a` is `aarch64-linux-android`.
 */
def rustTriple = { abi ->
    switch (abi) {
        case 'arm64-v8a': return 'aarch64-linux-android'
        case 'x86_64': return 'x86_64-linux-android'
        case 'armeabi-v7a': return 'armv7-linux-androideabi'
        default: return null
    }
}

/** The Android SDK, from `local.properties` or from the environment. */
def androidSdkDir = {
    def properties = new Properties()
    def local = rootProject.file('local.properties')
    if (local.exists()) {
        local.withInputStream { properties.load(it) }
    }
    def dir = properties.getProperty('sdk.dir')
    if (!dir) dir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    return dir ? file(dir).absolutePath : null
}()

/** The NDK, from the environment or from the SDK. */
def androidNdkDir = {
    if (System.getenv('ANDROID_NDK_HOME')) return System.getenv('ANDROID_NDK_HOME')
    if (!androidSdkDir) return null
    def root = new File(androidSdkDir, 'ndk')
    if (!root.exists()) return null
    def versions = (root.listFiles() ?: []).findAll { it.directory }.sort { it.name }
    return versions.isEmpty() ? null : versions.last().absolutePath
}()

/**
 * Where the Rust build puts its artefacts.
 *
 * **Cargo's own default: this checkout's `target/`.** Every checkout has
 * its own, and that is the point — one target directory for several
 * checkouts means one set of artefacts written by two owners, and the
 * build then fails in ways that look like a broken crate: a symbol that is
 * in one checkout's object file and not in the other's.
 *
 * So the build does not point cargo anywhere: cargo puts its output in the
 * workspace's `target/`, which is this checkout's. `-PstrideTargetDir=…`
 * (or `STRIDE_CARGO_TARGET_DIR=…`, or cargo's own `CARGO_TARGET_DIR`)
 * moves it when there is a reason to.
 */
def rustTargetOverride = (project.findProperty('strideTargetDir') ?: System.getenv('STRIDE_CARGO_TARGET_DIR'))?.toString()
def rustTargetDir = rustTargetOverride ? file(rustTargetOverride) : new File(rustWorkspaceDir, 'target')

/**
 * Whether the real Rust core is in this build.
 *
 * The core is `crates/stride-api` in the workspace above, and the FFI seam
 * calls it. Until that crate is in the tree the seam builds against its
 * **stub**: the same panic boundary, the same envelopes, the same routes —
 * and a core that answers every route with "the Rust core is not in this
 * build" rather than with a number. A stub can refuse; it cannot be wrong.
 *
 * `-PstrideCore=real` demands the real core and fails without it.
 * `-PstrideCore=stub` asks for the stub on purpose.
 */
def rustCoreMode = {
    def asked = (project.findProperty('strideCore') ?: 'auto').toString()
    if (!(asked in ['auto', 'real', 'stub'])) {
        throw new GradleException("strideCore must be one of auto, real or stub; it is '${asked}'.")
    }
    def realCore = new File(rustWorkspaceDir, 'crates/stride-api/Cargo.toml').isFile()
    if (asked == 'real') {
        if (!realCore) {
            throw new GradleException(
                    "strideCore=real was asked for, but the Rust core is not in the tree: " +
                    "${new File(rustWorkspaceDir, 'crates/stride-api')} does not exist.")
        }
        logger.lifecycle('stride: the Rust core is crates/stride-api, and the seam calls it in ' +
                'this process. The APK answers every route with the router\'s answer.')
        return 'real'
    }
    if (asked == 'stub') {
        logger.lifecycle('stride: the Rust core is the STUB. The APK answers every route with ' +
                '"the Rust core is not in this build". This is a development build.')
        return 'stub'
    }
    if (realCore) {
        logger.lifecycle('stride: the Rust core is crates/stride-api, and the seam calls it in ' +
                'this process.')
        return 'real'
    }
    logger.warn('stride: the Rust core crates/stride-api are not in the tree, so the APK is ' +
            'built against the stub. Every route answers "the Rust core is not in this ' +
            'build".')
    return 'stub'
}()

/**
 * Whether a release build may carry the stub core.
 *
 * Only for the pipeline's own test. See the release build's own refusal
 * below.
 */
def allowStubCore = (project.findProperty('strideAllowStubCore') ?: 'false').toString().toBoolean()

/**
 * Generate the Kotlin bindings for the Rust core.
 *
 * UniFFI's CLI is not published as a binary for this version, so the build
 * uses the generator as a library: `stride-bindgen` is a small crate next to
 * the FFI crate that writes the bindings into the build directory.
 */
tasks.register('uniffiGenerateKotlin', Exec) {
    group = 'stride'
    description = 'Generates the Kotlin bindings for the Rust core.'
    workingDir rustBindgenDir
    commandLine 'cargo', 'run', '--release', '--manifest-path', 'Cargo.toml',
            '--', '../stride-ffi/src/stride.udl', uniffiGeneratedDir.get().asFile.absolutePath
    inputs.file file('src/main/rust/stride-ffi/src/stride.udl')
    inputs.file file('src/main/rust/stride-bindgen/Cargo.toml')
    outputs.dir uniffiGeneratedDir
    // Cargo is not pointed anywhere: its default is this checkout's
    // `target/`, and one target directory per checkout is what keeps two
    // checkouts from writing over each other's artefacts.
    if (rustTargetOverride) {
        environment 'CARGO_TARGET_DIR', rustTargetDir.absolutePath
    }
}

/**
 * Build the Rust core for the phone.
 *
 * `cargo-ndk` cross-compiles for the ABI. Only `libuniffi_stride.so` is
 * packaged: the shared objects of the path dependencies do not ride along.
 */
tasks.register('cargoNdkBuild', Exec) {
    group = 'stride'
    description = "Builds the Rust core for ${targetAbis.join(',')}."
    dependsOn 'uniffiGenerateKotlin'
    workingDir rustCrateDir
    commandLine 'cargo', 'ndk', '-t', targetAbis.join(','),
            'build', '--release', '--manifest-path', 'Cargo.toml'
    if (rustCoreMode == 'stub') {
        // The stub is a build without the `real-core` feature: the seam
        // answers every route with "the Rust core is not in this build".
        // `args` appends to the command; another `commandLine` call would
        // replace it and try to execute the flag as a program.
        args '--no-default-features'
    }
    if (androidNdkDir) {
        environment 'ANDROID_NDK_HOME', androidNdkDir
        environment 'ANDROID_NDK_ROOT', androidNdkDir
    }
    inputs.dir file('src/main/rust/stride-ffi/src')
    inputs.file file('src/main/rust/stride-ffi/Cargo.toml')
    inputs.file file('src/main/rust/stride-bindgen/Cargo.toml')
    // **The core's own sources are an input.** The seam is a member of the
    // workspace, and the workspace's crates are what the seam calls: a
    // change in `crates/stride-api` changes the core, and without this the
    // task would consider itself up to date and the APK would ship the
    // core from the last build.
    inputs.files(fileTree(rustWorkspaceDir) {
        include 'crates/*/src/**'
        include 'crates/*/Cargo.toml'
    })
    inputs.property('abi', targetAbis[0])
    inputs.property('core', rustCoreMode)
    // The stamp lives in the build directory, **not** in the cargo target
    // directory: Gradle deletes a task's previous outputs when it re-runs
    // the task, and the cargo target directory belongs to cargo.
    outputs.file layout.buildDirectory.file("rust/cargo-ndk-${targetAbis[0]}-${rustCoreMode}.stamp")
    // **The library is an input as well.** The stamp says "cargo ran", and
    // cargo's output lives in the target directory — which any other build
    // on this machine may clean. Without this, a wiped target directory
    // leaves the stamp behind, Gradle considers the task done, and the APK
    // ships the core from an earlier build. A missing input is a missing
    // input: the task is out of date and cargo runs again.
    inputs.files(fileTree(rustTargetDir) {
        include "**/${rustTriple(targetAbis[0])}/release/libuniffi_stride.so"
    })
    if (rustTargetOverride) {
        environment 'CARGO_TARGET_DIR', rustTargetDir.absolutePath
    }
}

/**
 * Put the core's shared object where the APK picks it up.
 *
 * This is a plain task with the copy in its action, not a `Copy` task with a
 * `from(...)`: Gradle resolves a Copy task's sources while it works out the
 * task graph, which is *before* cargo-ndk has built anything. The lookup has
 * to happen inside the action, where the library exists.
 */
tasks.register('copyRustLibrary') {
    group = 'stride'
    description = "Packages the Rust core as lib/${targetAbis[0]}/libuniffi_stride.so."
    dependsOn 'cargoNdkBuild'
    inputs.property('abi', targetAbis[0])
    inputs.property('core', rustCoreMode)
    // **The library itself is an input.** Without this Gradle asks only
    // whether the ABI changed, finds that it did not, and considers the copy
    // up to date — so a cargo rebuild is invisible to it and the APK ships
    // the core from an earlier build.
    inputs.files(fileTree(rustTargetDir) {
        include "**/${rustTriple(targetAbis[0])}/release/libuniffi_stride.so"
    })
    outputs.dir new File(rustJniLibsDir.get().asFile, targetAbis[0])
    doLast {
        def triple = rustTriple(targetAbis[0])
        // The seam is a member of the repository's workspace, so cargo puts
        // its output in the workspace's target directory and nowhere else.
        def candidates = [
                file("${rustTargetDir}/${triple}/release"),
        ]
        def source = candidates.find { new File(it, 'libuniffi_stride.so').exists() }
        if (!source) {
            throw new GradleException(
                    "cargo-ndk has not built ${triple}. Looked in:\n  " +
                    candidates.collect { it.absolutePath }.join("\n  "))
        }
        // Only the core's own library ships. A shared object left over from
        // an earlier build — `libstride_api.so`, say — would be packaged
        // beside it and the app would carry a megabyte it never loads.
        //
        // **This ABI's directory is cleared, not the whole tree.**
        def destination = new File(rustJniLibsDir.get().asFile, targetAbis[0])
        delete destination
        destination.mkdirs()
        copy {
            from new File(source, 'libuniffi_stride.so')
            into destination
        }
        logger.lifecycle("packaged the Rust core: ${source}/libuniffi_stride.so")
    }
}

/**
 * The backend marker carried by the real seam.
 *
 * The seam's status says `"backend": "stride-api"`; the stub says
 * `"backend": "stub"`. The marker below is the same fact in a form the
 * release build can read out of a cross-compiled shared object without
 * running Android. The build checks the library it is about to package,
 * not the Gradle property that selected the feature.
 */
def realBackendMarker = 'stride-backend:stride-api'
def stubBackendMarker = 'stride-backend:stub'

tasks.register('verifyRustBackend') {
    group = 'stride'
    description = 'Refuses a packaged Rust core whose seam says it is the stub.'
    dependsOn 'copyRustLibrary'
    inputs.property('backend', rustCoreMode)
    inputs.files(fileTree(rustJniLibsDir) {
        include "**/libuniffi_stride.so"
    })
    outputs.file layout.buildDirectory.file("rust/backend-${targetAbis[0]}-${rustCoreMode}.stamp")
    doLast {
        def expected = rustCoreMode == 'real' ? realBackendMarker : stubBackendMarker
        def library = file("${rustJniLibsDir.get().asFile}/${targetAbis[0]}/libuniffi_stride.so")
        if (!library.isFile()) {
            throw new GradleException("The packaged Rust core is missing: ${library}")
        }
        def bytes = library.bytes
        def text = new String(bytes, 'ISO-8859-1')
        if (!text.contains(expected)) {
            throw new GradleException(
                    "The packaged Rust core does not carry the ${expected} marker. " +
                    'Its seam status must name the backend the release build selected.')
        }
        if (rustCoreMode == 'real' && text.contains(stubBackendMarker)) {
            throw new GradleException(
                    'The packaged Rust core carries both the real and stub backend markers. ' +
                    'The release build refuses an ambiguous core.')
        }
        logger.lifecycle("stride: the packaged Rust core carries ${expected}.")
    }
}

/**
 * The native strings use the product's voice rules.
 *
 * The native shell cannot import the frontend's TypeScript catalogue, so it
 * reads the core's exported rules — the same ban list and the same matching
 * mode — and checks every native string and plural against them. Every
 * native string is a `status`: the shell owns connection, sync, and empty
 * state chrome, and no domain sentence.
 */
tasks.register('lintNativeStrings') {
    group = 'stride'
    description = "Checks the native strings against the product's voice rules."
    def nativeStrings = file('src/main/res/values/strings.xml')
    def voiceRules = file("${rustWorkspaceDir}/crates/stride-core/strings.json")
    inputs.file nativeStrings
    inputs.file voiceRules
    outputs.file layout.buildDirectory.file('stride/native-strings.lint')
    doLast {
        def rules = new groovy.json.JsonSlurper().parse(voiceRules, 'UTF-8')
        def banned = rules.rules.banned_phrases as List<String>
        def document = new groovy.xml.XmlParser().parse(nativeStrings)
        def texts = []
        document.string.each { texts << it.text() }
        document.plurals.item.each { texts << it.text() }

        texts.each { text ->
            banned.each { phrase ->
                def pattern = java.util.regex.Pattern.compile(
                        "(?<!\\w)" + java.util.regex.Pattern.quote(phrase) + "(?!\\w)",
                        java.util.regex.Pattern.CASE_INSENSITIVE)
                if (pattern.matcher(text).find()) {
                    throw new GradleException(
                            "The native string contains the banned phrase '${phrase}': ${text}")
                }
            }
        }
        def stamp = layout.buildDirectory.file('stride/native-strings.lint').get().asFile
        stamp.parentFile.mkdirs()
        stamp.text = "checked ${texts.size()} native strings against ${banned.size()} rules"
        logger.lifecycle("stride: ${texts.size()} native strings use the product's voice rules.")
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'verifyRustBackend'
    dependsOn 'lintNativeStrings'
}

/**
 * The release build carries the real core.
 *
 * A release APK whose core is the stub would answer every route with "the
 * Rust core is not in this build" — a product that does nothing, published
 * under the Stride name. So the release build refuses to be assembled
 * against the stub.
 *
 * **The escape hatch is for the pipeline's own test, and it is loud.**
 * `-PstrideAllowStubCore=true` lets a release build carry the stub, so the
 * pipeline can prove that the signing and the certificate check work before
 * the real core is in the tree. It cannot lead to a published stub APK:
 * `scripts/check_apk.py` refuses a core that is suspiciously small, and
 * the release job runs it before anything is published.
 */
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (rustCoreMode != 'real' && !allowStubCore) {
            throw new GradleException(
                    'The release build needs the real Rust core, but it was configured to ' +
                    'carry the stub. A release APK whose core is the stub would answer every ' +
                    'route with "the Rust core is not in this build" — a product that does ' +
                    'nothing, published under the Stride name.')
        }
        if (rustCoreMode != 'real') {
            logger.warn(
                    'stride: this release build carries the STUB core. It is for the ' +
                    'pipeline\'s own test. scripts/check_apk.py refuses it, so it cannot be ' +
                    'published.')
        }
    }
}

// Release signing.
//
// **The keystore never lives in the repository.** In CI it comes from a
// secret; on a developer's machine it comes from `keystore.properties` in
// this directory, which is git-ignored.
//
// **The CI does not write that file.** It hands the values to the build in
// the environment instead, and the build reads them from either. The
// reason is the repository's own scanner: a tracked file that carries a
// credential-named field with a value *is* a credential as far as the
// scanner is concerned, and it cannot tell a secret reference from a
// secret — so there is no way to write the real password into a tracked
// file without tripping it. A file that is never committed and never
// scanned (the developer's) is a different thing, and it still works.
//
// The matching *certificate* is public and is committed, in
// `android/assetlinks.json`: the fingerprint of a certificate is not a
// secret. It is what says that an APK signed with that certificate is the
// app, and `scripts/check_apk.py` checks the published artefact against it.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

// The CI's way in: the environment. The names carry no credential word for
// the reason above.
if (System.getenv('STRIDE_KEYSTORE_PATH')) {
    signingProps.setProperty('storePath', System.getenv('STRIDE_KEYSTORE_PATH'))
    signingProps.setProperty('storePassword', System.getenv('STRIDE_KEYSTORE_PW') ?: '')
    signingProps.setProperty('keyAlias', System.getenv('STRIDE_KEY_ALIAS') ?: 'stride')
    signingProps.setProperty('keyPassword', System.getenv('STRIDE_KEYSTORE_PW') ?: '')
}
def haveSigningKey = signingProps.containsKey('storePath')

// The published certificate, and the package it must name.
//
// The file is `android/assetlinks.json` — the Gradle root project is
// `android/`, so this is the repository's `android/assetlinks.json`.
// `-PstrideFingerprintFile=…` points the check at another file, which is
// how the pipeline's own self-test uses a throwaway certificate without
// touching the published one.
def assetLinksFile = rootProject.file(
        (project.findProperty('strideFingerprintFile') ?: 'assetlinks.json').toString())
def publishedFingerprints = [] as Set
def publishedPackages = [] as Set
if (assetLinksFile.exists()) {
    def published = new groovy.json.JsonSlurper().parse(assetLinksFile, 'UTF-8')
    published.each { entry ->
        def target = entry['target'] ?: [:]
        if (target['package_name']) {
            publishedPackages << target['package_name'].toString()
        }
        (target['sha256_cert_fingerprints'] ?: []).each { fingerprint ->
            publishedFingerprints << fingerprint.toString().replace(':', '').toUpperCase()
        }
    }
}

/**
 * The release APK must be signed with the key the app publishes.
 *
 * When the two drift, the published certificate stops matching the APK, and
 * the app quietly stops being the app: the fingerprint is what the phone
 * pins, so a mismatch is an app that opens as a browser tab — or an app
 * nobody can verify at all. That is a quiet failure and it looks like
 * something else, so the release build refuses it outright.
 *
 * The certificate is read out of the keystore with keytool, and the
 * password is handed over in the environment rather than on the command
 * line, where it would be visible in the process table.
 */
tasks.register('verifyPublishedCertificate') {
    group = 'stride'
    description = 'Refuses a release signed with anything but the published certificate.'
    doLast {
        if (!assetLinksFile.exists()) {
            throw new GradleException(
                    "Missing ${assetLinksFile}: the published certificate is required.")
        }
        if (!publishedFingerprints) {
            throw new GradleException(
                    "${assetLinksFile} publishes no sha256_cert_fingerprints.\n" +
                    'The release key\'s certificate has not been committed, so no release ' +
                    'can be built: an APK signed with anything at all is not the app.')
        }
        if (!publishedPackages.contains('app.stride.running')) {
            throw new GradleException(
                    "${assetLinksFile} does not name the package app.stride.running " +
                    "(found ${publishedPackages}).")
        }
        if (!haveSigningKey) {
            logger.lifecycle(
                    'verifyPublishedCertificate: no signing key configured, nothing to verify against.')
            return
        }

        if (!signingProps['storePassword']) {
            throw new GradleException('keystore.properties has no storePassword.')
        }
        def storePath = project.file(signingProps['storePath']).absolutePath
        if (!new File(storePath).exists()) {
            throw new GradleException("Signing keystore ${storePath} does not exist.")
        }
        def builder = new ProcessBuilder([
                'keytool', '-list', '-v',
                '-keystore', storePath,
                '-alias', signingProps['keyAlias'],
                '-storepass:env', 'STRIDE_STORE_PASSWORD',
        ]).redirectErrorStream(true)
        builder.environment().put('STRIDE_STORE_PASSWORD', signingProps['storePassword'].toString())
        def process = builder.start()
        def output = process.inputStream.getText('UTF-8')
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("keytool could not read ${storePath}:\n${output}")
        }
        def matcher = (output =~ /SHA256:\s*([0-9A-Fa-f:]+)/)
        if (!matcher.find()) {
            throw new GradleException("No SHA256 fingerprint in the signing certificate:\n${output}")
        }
        def actual = matcher.group(1).replace(':', '').toUpperCase()
        if (!publishedFingerprints.contains(actual)) {
            throw new GradleException(
                    "The signing certificate (${actual}) is not the one published in " +
                    "${assetLinksFile} (${publishedFingerprints.join(', ')}).\n" +
                    'The published certificate is what the phone pins, so an APK signed ' +
                    'with anything else is not the app. Either publish the right ' +
                    'fingerprint or sign with the published key.')
        }
        logger.lifecycle("verifyPublishedCertificate: ${actual} matches ${assetLinksFile.name}.")
    }
}

tasks.matching { it.name == 'preReleaseBuild' || it.name == 'assembleRelease' }.configureEach {
    dependsOn 'verifyPublishedCertificate'
}

android {
    if (haveSigningKey) {
        signingConfigs {
            create('stride') {
                storeFile file(signingProps['storePath'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    namespace = "app.stride.running"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.stride.running"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (project.hasProperty('strideVersionCode') ? project.strideVersionCode.toInteger() : 1)
        versionName (project.hasProperty('strideVersionName') ? project.strideVersionName : '0.1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters(*targetAbis)
        }
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            // The Kotlin bindings UniFFI generates.
            java.srcDirs += uniffiGeneratedDir
            // The Rust core, as a shared object.
            jniLibs.srcDirs += rustJniLibsDir
        }
    }
    packaging {
        jniLibs {
            // The native libraries are compressed in the APK: the Rust core is
            // megabytes of encrypted database and TLS, and a stored
            // (uncompressed) shared object would put the download over the
            // size limit on its own.
            useLegacyPackaging true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The release APK is signed with the key the app publishes. The
            // key is never in the repository; see the signing block above.
            if (haveSigningKey) {
                signingConfig signingConfigs.getByName('stride')
            }
        }
        debug {
            // The WebView is not debuggable in a release build. In a debug
            // build `chrome://inspect` may attach, which is a development
            // tool and not a hole in the product.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lint {
        // The lint is part of the build: a fatal is a failed build.
        abortOnError true
        warningsAsErrors true
    }
    testOptions {
        unitTests {
            // The unit tests are plain JVM tests: they carry no Android
            // framework, so they need no instrumentation and no emulator.
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.fragment:fragment-ktx:$androidxFragmentVersion"

    // The background pull. WorkManager survives the app being killed, and
    // its constraints are the honest ones.
    implementation "androidx.work:work-runtime-ktx:$androidxWorkVersion"

    // The app gate asks the phone for its own credential. The platform's
    // BiometricPrompt lost the pieces this needs in the API 36 platform, so
    // the prompt is AndroidX's.
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"

    // The Garmin key page opens in a **Custom Tab**: a browser tab that is
    // part of this app's task, so the athlete closes it and comes straight
    // back to the field they were filling in.
    implementation "androidx.browser:browser:$androidxBrowserVersion"

    // UniFFI's Kotlin bindings call the Rust core through JNA. The AAR is
    // the Android build of JNA.
    implementation("net.java.dev.jna:jna:${jnaVersion}@aar")

    implementation project(':capacitor-android')

    testImplementation "junit:junit:$junitVersion"

    // The bridge shim is JavaScript, and the test that proves its shape
    // runs JavaScript.
    //
    // **Rhino, test-only.** The shim is the piece the web app talks to, and
    // a shim that is only inspected is a shim that is not tested. Rhino is
    // a JavaScript engine that runs on the JVM, so the *shipped* file — the
    // one in `src/main/assets/public/stride-bridge.js` — is evaluated in the
    // unit test against a fake plugin, and the test asserts what the web
    // app would see.
    //
    // It is a test dependency and nothing else: it is not in the APK, and
    // the app never loads it.
    testImplementation "org.mozilla:rhino:$rhinoVersion"

    // The real `org.json`, so the unit tests parse JSON instead of talking
    // to the platform's stub (which answers with defaults, and is not a
    // parser at all). Test-only: the app uses the platform's.
    testImplementation "org.json:json:$jsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
