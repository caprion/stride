# The Stride workspace.
#
# The root manifest is owned by the orchestrator. Workstreams own their crate
# directory and must not edit this file — say what you need and it will be
# added. Six agents editing one manifest is how merge conflicts are made.
#
# The contract these crates implement is docs/rust-core-spec.md.

[workspace]
resolver = "2"
members = [
    "crates/stride-core",
    "crates/stride-fit",
    "crates/stride-garmin",
    "crates/stride-store",
    "crates/stride-api",
    "crates/stride-mcp",
    "desktop",
    # The phone's own crate. It is in the root workspace so the root's gate
    # covers it too - one command, one answer about the whole system.
    "android/app/src/main/rust/stride-ffi",
    "android/app/src/main/rust/stride-ffi/stride-bindgen",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

# Panics in a library are a process kill on a phone. The FFI boundary catches
# them, but the rule is that the library does not raise them at all.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
# Warn rather than deny: the FFI boundary must be `unsafe`, and it is the one
# place it is allowed. The gate checks that `unsafe` appears nowhere else.
unsafe_code = "warn"
# A rustc lint, not a clippy one — it belongs here or every crate prints an
# unknown-lint warning.
missing_debug_implementations = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "gzip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Deliberately NOT panic = "abort": the FFI boundary catches panics with
# catch_unwind and turns them into an error the app can show. Aborting would
# make a panic a process kill.
strip = true
