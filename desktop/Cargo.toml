[package]
name = "stride-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The library and the binary. The library exists so that the tests can drive
# the server, the router and the static-file resolver without starting a
# process.
[lib]
name = "stride_desktop"
path = "src/lib.rs"

[[bin]]
name = "stride"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# The plaintext-to-SQLCipher conversion reads the legacy database with a plain
# SQLite connection. `rusqlite` is in the approved dependency set and is
# already in the workspace, so this adds no new crate to the graph.
# The plain SQLite connection is what reads the reference app's database
# while it is being converted. `VACUUM INTO` does the snapshot and needs no
# extra feature.
rusqlite = { workspace = true }
# The HTTPS listener, for a phone's browser.
#
# `rustls` and `ring` are already in the binary: `reqwest` (the Garmin
# client) is built on `rustls-tls`, so the TLS stack is in the graph and in
# the binary already. Naming it here adds no new crate to the graph — it
# only turns on the *server* half of a library that is already linked.
# `rustls-pemfile` is rustls's own PEM reader; it adds two small crates
# (`rustls-pemfile` and `pem`), and `base64`, which is in the lock already.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pemfile = "2"
stride-api = { path = "../crates/stride-api" }
stride-store = { path = "../crates/stride-store" }

# The workspace's rules: no `unwrap`, no `expect`, no `panic!` and no `unsafe`
# in the library.
[lints]
workspace = true
