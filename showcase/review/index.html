<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stride &mdash; the review</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; padding: 32px; background: #f4f7fa; color: #0b1b27;
             font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p.lede { margin: 0 0 28px; color: #61788d; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
      figure { margin: 0; background: #fff; border: 1px solid #dee7ee; border-radius: 10px; overflow: hidden; }
      figure img { width: 100%; display: block; background: #fff; }
      figcaption { padding: 10px 14px; border-top: 1px solid #dee7ee; display: grid; gap: 2px; }
      figcaption strong { font-size: 14px; }
      figcaption span { font-size: 12px; color: #61788d; }
      .problems { margin-top: 28px; padding: 14px 18px; border-radius: 10px;
                  background: #fff; border: 1px solid #dee7ee; }
      .problems h2 { font-size: 15px; margin: 0 0 8px; }
      .problems li { font-size: 13px; color: #c0392b; }
    </style>
  </head>
  <body>
    <h1>Stride &mdash; every screen</h1>
    <p class="lede">The desktop and the phone are the same app with different surfaces.
       18 screens, captured against the real data.</p>
    <div class="grid">
      <figure>
        <a href="desktop-today.png"><img src="desktop-today.png" alt="Today" loading="lazy" /></a>
        <figcaption><strong>Today</strong><span>desktop &middot; /</span><span>Good afternoon, athlete</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-plan.png"><img src="desktop-plan.png" alt="Plan" loading="lazy" /></a>
        <figcaption><strong>Plan</strong><span>desktop &middot; /plan</span><span>Plan vs actual</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-runs.png"><img src="desktop-runs.png" alt="Runs" loading="lazy" /></a>
        <figcaption><strong>Runs</strong><span>desktop &middot; /feed</span><span>Activity feed</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-body.png"><img src="desktop-body.png" alt="Body" loading="lazy" /></a>
        <figcaption><strong>Body</strong><span>desktop &middot; /physiology</span><span>Physiology</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-form.png"><img src="desktop-form.png" alt="Form" loading="lazy" /></a>
        <figcaption><strong>Form</strong><span>desktop &middot; /fitness</span><span>Running fingerprint</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-stats.png"><img src="desktop-stats.png" alt="Stats" loading="lazy" /></a>
        <figcaption><strong>Stats</strong><span>desktop &middot; /stats</span><span>Statistics</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-activity.png"><img src="desktop-activity.png" alt="An activity" loading="lazy" /></a>
        <figcaption><strong>An activity</strong><span>desktop &middot; /activities/162</span><span>Bengaluru Running</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-compare.png"><img src="desktop-compare.png" alt="Compare" loading="lazy" /></a>
        <figcaption><strong>Compare</strong><span>desktop &middot; /compare</span><span>Compare runs</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-calendar.png"><img src="desktop-calendar.png" alt="Training calendar" loading="lazy" /></a>
        <figcaption><strong>Training calendar</strong><span>desktop &middot; /training</span><span>Training log</span></figcaption>
      </figure>
      <figure>
        <a href="desktop-settings.png"><img src="desktop-settings.png" alt="Settings" loading="lazy" /></a>
        <figcaption><strong>Settings</strong><span>desktop &middot; /settings</span><span>Settings</span></figcaption>
      </figure>
      <figure>
        <a href="phone-today.png"><img src="phone-today.png" alt="Today" loading="lazy" /></a>
        <figcaption><strong>Today</strong><span>phone &middot; /</span><span>Good afternoon, athlete</span></figcaption>
      </figure>
      <figure>
        <a href="phone-plan.png"><img src="phone-plan.png" alt="Plan" loading="lazy" /></a>
        <figcaption><strong>Plan</strong><span>phone &middot; /plan</span><span>Plan</span></figcaption>
      </figure>
      <figure>
        <a href="phone-runs.png"><img src="phone-runs.png" alt="Runs" loading="lazy" /></a>
        <figcaption><strong>Runs</strong><span>phone &middot; /feed</span><span>Runs</span></figcaption>
      </figure>
      <figure>
        <a href="phone-body.png"><img src="phone-body.png" alt="Body" loading="lazy" /></a>
        <figcaption><strong>Body</strong><span>phone &middot; /physiology</span><span>Body</span></figcaption>
      </figure>
      <figure>
        <a href="phone-form.png"><img src="phone-form.png" alt="Form" loading="lazy" /></a>
        <figcaption><strong>Form</strong><span>phone &middot; /fitness</span><span>Form</span></figcaption>
      </figure>
      <figure>
        <a href="phone-stats.png"><img src="phone-stats.png" alt="Stats" loading="lazy" /></a>
        <figcaption><strong>Stats</strong><span>phone &middot; /stats</span><span>Statistics</span></figcaption>
      </figure>
      <figure>
        <a href="phone-activity.png"><img src="phone-activity.png" alt="An activity" loading="lazy" /></a>
        <figcaption><strong>An activity</strong><span>phone &middot; /activities/162</span><span>Bengaluru Running</span></figcaption>
      </figure>
      <figure>
        <a href="phone-settings.png"><img src="phone-settings.png" alt="Settings" loading="lazy" /></a>
        <figcaption><strong>Settings</strong><span>phone &middot; /settings</span><span>Settings</span></figcaption>
      </figure>
    </div>
    <div class="problems">
      <h2>Console</h2>
      <p>No console errors on any screen.</p>
    </div>
  </body>
</html>
