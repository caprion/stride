[package]
name = "stride-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# gzip. `flate2` with the pure-Rust backend: no C library, so the Android
# NDK build has nothing extra to link. It is already in the workspace's
# lock file (reqwest's gzip feature pulls it in), so this adds no new crate
# to the graph.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
stride-core = { path = "../stride-core" }
stride-fit = { path = "../stride-fit" }
stride-garmin = { path = "../stride-garmin" }
stride-store = { path = "../stride-store" }

[lints]
workspace = true
