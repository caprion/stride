<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2B01E" />
    <meta
      name="description"
      content="Stride — a private, local-first running log with native Garmin ingest."
    />
    <title>Stride — a private training log</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fc5200'/%3E%3Cpath d='M7 21l5-9 4 5 3-4 6 8z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      /* Inter is self-hosted: the app must not tell a third party that the
         athlete is looking at a running dashboard. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-var.woff2') format('woff2');
      }
    </style>
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none';
               form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
               font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
