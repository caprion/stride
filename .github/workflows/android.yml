name: android

# Builds the Android app and, on a tag, publishes the APK as a release
# asset so anyone can download it from the Releases page — no store, no
# account, no review queue.
#
# The APK is signed with a key that lives only in the repository secrets.
# The matching *certificate* is public and committed, in
# backend/app/assetlinks.json, which is what lets the app open the web app
# as a real app instead of a browser tab.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend tests and the security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix frontend ci
      - name: Tests
        run: cd backend && python -m pytest -q
      - name: Security gate
        run: ./scripts/security_check.sh

  apk:
    name: Build the APK
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 compiles against Java 21.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The GitHub runner image already carries the Android SDK. It is only
      # missing the platform, the build-tools and the NDK this project
      # targets.
      - name: Install the Android platform and the NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # sdkmanager is not on the runner's PATH.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      # The phone's core is Rust, cross-compiled for the device by cargo-ndk.
      - name: Install the Rust toolchain for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          # The prebuilt binary. `cargo install cargo-ndk` works too, but it
          # spends minutes compiling a build script that the runner does not
          # need to compile.
          uses: taiki-e/install-action@v2
          with:
            tool: cargo-ndk
          cargo ndk --version

      - name: Install the node modules
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Work out the version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev"
          fi
          code=$(git rev-list --count HEAD)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Fetch the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keys/stride.jks"
          cat > android/keystore.properties <<EOF
          storePath=$RUNNER_TEMP/keys/stride.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=stride
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Restore the web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Sync the web app into the Android project
        run: npx cap sync android

      - name: Point the build at the NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          CARGO_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> android/local.properties

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          CARGO_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: ./gradlew assembleRelease --no-daemon
          -PstrideVersionName="${{ steps.version.outputs.name }}"
          -PstrideVersionCode="${{ steps.version.outputs.code }}"

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/stride-${{ github.ref_name }}.apk" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/app-release.apk dist/stride.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          retention-days: 30

  release:
    name: Publish the release
    needs: [apk, backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Stride for Android

            Download the APK below, install it, and open Stride.

            The app is served by **your own instance** — Stride has no cloud
            and no account. If you are running Stride yourself, point the app
            at your machine; if you are trying it, see the README.

            ### Installing

            1. Download `stride-*.apk` to the phone.
            2. Open it and allow installs from this source.
            3. Launch Stride. On first run it asks for a pairing code — run
               `./scripts/prod.sh pair` on the machine running Stride and
               type the code in.

            The APK is signed with a key whose certificate is published in
            `backend/app/assetlinks.json`, so the app opens the web app as a
            real app rather than a browser tab.
