[package]
name = "stride-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The UniFFI surface the Android shell calls: the seam, the panic boundary, and the setup the phone has to do once."

# A member of the repository's workspace, so the root gate sees it:
# `cargo fmt --check`, `cargo clippy --workspace --all-targets -D warnings`
# and `cargo test --workspace` all cover the seam. A crate outside the
# workspace is a crate nobody checks.
#
# The lint table is inherited, not restated: a crate that declares its own
# lint table can silently re-allow `unwrap`, and scripts/check-deps.sh
# refuses that. `unsafe_code` is `allow` in the workspace, and the rule that
# matters — `unsafe` only inside this crate — is enforced by the contract
# grep (scripts/check-contract-greps.sh), which is where a lint cannot be
# evaded by a `#[allow]`.
[lints]
workspace = true

[lib]
# `cdylib` is what the APK packages; `rlib` is what the tests link.
# The file name is `libuniffi_stride.so`, because UniFFI's Kotlin bindings
# load the library by the namespace's name (`uniffi_stride`).
name = "uniffi_stride"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The scaffolding generator runs in the build script, so UniFFI is a build
# dependency as well as a normal one.
uniffi = { version = "0.29", features = ["build"] }
# The envelopes are JSON in / JSON out, and the stub and the boundary both
# build them.
serde_json = "1"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
# The router's own envelope, so the seam's can be proved to be the same
# one. The seam calls this crate for real when it is wired to the core;
# until then it is here so that the two sides of the boundary cannot drift
# apart — see `tests/envelope_parity.rs`.
stride-api = { path = "../../../../../../crates/stride-api" }
