# The phone shell's Gradle settings.
#
# Everything here is a build-time knob, and nothing here is a secret.

# The Gradle daemon's heap. The phone shell is small; the Rust build is not,
# and the Rust build is not run by Gradle.
org.gradle.jvmargs=-Xmx1536m

# AndroidX. The Capacitor library is an AndroidX library, so the app is too.
android.useAndroidX=true

# The build never downloads a snapshot or a dynamic version on its own: the
# versions are pinned in `variables.gradle` and in `app/build.gradle`.
android.enableR8.fullMode=true
