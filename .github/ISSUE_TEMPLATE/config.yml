# The intake.
#
# Three templates — a bug, a piece of feedback, a request — and one queue.
# The security link is private on purpose: a vulnerability must not be
# public, and this is where that rule is made visible rather than implied.
#
# The field ids in the templates (platform, version, kind) are stable and
# public: an app can pre-fill them with a query string, so a report that
# starts inside the app arrives with the version and the platform already
# filled in.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/caprion/stride/security/advisories/new
    about: Private, and the right place for a vulnerability. Do not open a public issue.
  - name: The plan of record
    url: https://github.com/caprion/stride/blob/master/PLAN.md
    about: What is already planned, and what the scope is. Read it before you open a request.
