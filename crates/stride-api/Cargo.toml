[package]
name = "stride-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
stride-core = { path = "../stride-core" }
stride-ingest = { path = "../stride-ingest" }
stride-store = { path = "../stride-store" }

# The response shapes are serialized on their way out, and the clock is a
# `DateTime<Utc>`. Nothing else is needed: the router has no HTTP server of
# its own, and the FFI surface speaks JSON.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not a nicety: serde_json's fast float parser reads the
# router's -24.189999999999998 as the neighbouring double and serialises it as
# -24.19, so a comparison of the app's fixture against the router's answer
# fails by one unit. With the feature the parse round-trips exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
# The fixture-parity test seeds a store with the fixture's own primary keys,
# which the repositories' upserts do not do: it inserts the rows directly.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
