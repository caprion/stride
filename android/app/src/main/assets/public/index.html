<!doctype html>
<!--
    The placeholder bundle.

    The app's web bundle is built by the frontend and copied into this
    directory by `android/sync-web.sh`. This page is what the WebView finds
    when the bundle has not been installed — it says so, in the app's own
    words, rather than showing a blank screen.

    It is a *placeholder*, and it is replaced wholesale by the bundle.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stride</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        color: #b9c2cc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        padding: 24px;
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 { color: #f2f5f8; font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { line-height: 1.5; margin: 0.5rem 0; }
      code { color: #4fd1c5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Stride</h1>
      <p>
        The app's own bundle has not been installed in this build. It is
        copied into <code>android/app/src/main/assets/public</code> by
        <code>android/sync-web.sh</code>.
      </p>
      <p>Your data stays on this phone.</p>
    </main>
  </body>
</html>
