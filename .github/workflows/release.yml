name: Release

# Runs only on upstream tags, never on pull requests, so a fork contributor's
# PR can never touch it or its secrets. The gates must pass first, the write
# permission is scoped to the publish job, and a tag whose commit is not
# reachable from master is refused.
#
# The signing secret for the APK lands here — in the publish job only, scoped
# by environment — when the phone pipeline exists (Slice 1+).
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/gate.sh

  publish:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: refuse tags not on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "refusing: tag commit $GITHUB_SHA is not reachable from master" >&2
            exit 1
          fi
      - name: publish (placeholder)
        run: |
          echo "Release placeholder — the signed APK and desktop binaries are"
          echo "wired in a later slice. The signing secret goes here, scoped to"
          echo "this job only, and never in ci.yml."
