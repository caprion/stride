apply plugin: 'com.android.application'

// The phone's shell is Kotlin: the bridge, the Keystore, the worker and the
// notifications.
apply plugin: 'org.jetbrains.kotlin.android'

// ---------------------------------------------------------------------------
// The Rust core.
//
// The phone runs the Rust core **in this process**: `cargo-ndk` builds it
// for `aarch64-linux-android`, UniFFI generates the Kotlin bindings from the
// UDL, and the shared object is packaged as `libuniffi_stride.so`.
//
// **arm64-v8a only.** Almost every phone in use is arm64, and the release
// APK has to stay under 10 MB; a second ABI would take ~2.2 MB of that.
// ---------------------------------------------------------------------------

/** The Rust workspace of the phone. */
def rustCrateDir = file('src/main/rust/stride-ffi')

/** Where the generated Kotlin bindings go. */
def uniffiGeneratedDir = layout.buildDirectory.dir('generated/uniffi/kotlin')

/** Where `cargo-ndk` puts the shared objects. */
def rustJniLibsDir = layout.buildDirectory.dir('rust/jniLibs')

/** The Android SDK, from `local.properties` or the environment. */
def androidSdkDir = {
    def properties = new Properties()
    def local = rootProject.file('local.properties')
    if (local.exists()) {
        local.withInputStream { properties.load(it) }
    }
    def dir = properties.getProperty('sdk.dir')
    if (!dir) dir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    return dir ? file(dir).absolutePath : null
}()

/** The NDK, from the environment or from the SDK. */
def androidNdkDir = {
    if (System.getenv('ANDROID_NDK_HOME')) return System.getenv('ANDROID_NDK_HOME')
    if (!androidSdkDir) return null
    def root = new File(androidSdkDir, 'ndk')
    if (!root.exists()) return null
    def versions = (root.listFiles() ?: []).findAll { it.directory }.sort { it.name }
    return versions.isEmpty() ? null : versions.last().absolutePath
}()

/**
 * Generate the Kotlin bindings for the Rust core.
 *
 * UniFFI's CLI is not published as a binary for this version, so the build
 * uses the generator as a library: `stride-bindgen` is a small crate in
 * `src/main/rust/stride-bindgen` that writes the bindings into the build
 * directory.
 */
tasks.register('uniffiGenerateKotlin', Exec) {
    group = 'stride'
    description = 'Generates the Kotlin bindings for the Rust core.'
    workingDir rustCrateDir
    commandLine 'cargo', 'run', '--release', '--manifest-path', 'stride-bindgen/Cargo.toml',
            '--', 'src/stride.udl', uniffiGeneratedDir.get().asFile.absolutePath
    inputs.file file('src/main/rust/stride-ffi/src/stride.udl')
    outputs.dir uniffiGeneratedDir
}

/**
 * Build the Rust core for the phone.
 *
 * `cargo-ndk` cross-compiles for `aarch64-linux-android` and drops the
 * shared object into the jniLibs tree, which the APK then packages.
 */
tasks.register('cargoNdkBuild', Exec) {
    group = 'stride'
    description = 'Builds the Rust core for aarch64-linux-android.'
    dependsOn 'uniffiGenerateKotlin'
    workingDir rustCrateDir
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a',
            '-o', rustJniLibsDir.get().asFile.absolutePath,
            'build', '--release', '--manifest-path', 'Cargo.toml'
    if (androidNdkDir) {
        environment 'ANDROID_NDK_HOME', androidNdkDir
        environment 'ANDROID_NDK_ROOT', androidNdkDir
    }
    inputs.dir file('src/main/rust/stride-ffi/src')
    inputs.file file('src/main/rust/stride-ffi/Cargo.toml')
    outputs.dir rustJniLibsDir
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'cargoNdkBuild'
}

// Release signing.
//
// The keystore never lives in the repository. In CI it comes from a secret;
// on a developer's machine it comes from keystore.properties in this
// directory, which is git-ignored.
//
// The matching *certificate* is public and is committed, in
// backend/app/assetlinks.json — that is what lets the app verify this
// origin and open as a real app rather than a browser tab.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def haveSigningKey = signingProps.containsKey('storePath')

// The published fingerprint has to be the fingerprint of the key the APK is
// actually signed with. When the two drift, Digital Asset Links stops
// matching and the Trusted Web Activity quietly degrades into a browser tab
// with a web page in it, which looks like a broken app rather than a broken
// signature and is easy to miss. So the release build checks it.
//
// The check reads the certificate out of the keystore with keytool; the
// password is handed over in the environment rather than on the command
// line, where it would be visible in the process table.
tasks.register('verifyAssetLinksFingerprint') {
    doLast {
        def assetLinks = project.rootProject.file('../backend/app/assetlinks.json')
        if (!assetLinks.exists()) {
            throw new GradleException("Missing ${assetLinks}: the published asset links file is required.")
        }
        def published = new groovy.json.JsonSlurper().parse(assetLinks, 'UTF-8')
        def packageNames = [] as Set
        def fingerprints = [] as Set
        published.each { entry ->
            def target = entry['target'] ?: [:]
            if (target['package_name']) {
                packageNames << target['package_name'].toString()
            }
            (target['sha256_cert_fingerprints'] ?: []).each { fp ->
                fingerprints << fp.toString().replace(':', '').toUpperCase()
            }
        }
        if (!fingerprints) {
            throw new GradleException("${assetLinks} publishes no sha256_cert_fingerprints.")
        }
        if (!packageNames.contains('app.stride.running')) {
            throw new GradleException("${assetLinks} does not name the package app.stride.running (found ${packageNames}).")
        }
        if (!haveSigningKey) {
            logger.lifecycle('verifyAssetLinksFingerprint: no signing key configured, nothing to verify against.')
            return
        }

        def storePassword = signingProps['storePassword']
        if (!storePassword) {
            throw new GradleException('keystore.properties has no storePassword.')
        }
        def storePath = project.file(signingProps['storePath']).absolutePath
        if (!new File(storePath).exists()) {
            throw new GradleException("Signing keystore ${storePath} does not exist.")
        }
        def builder = new ProcessBuilder([
                'keytool', '-list', '-v',
                '-keystore', storePath,
                '-alias', signingProps['keyAlias'],
                '-storepass:env', 'STRIDE_STORE_PASSWORD',
        ]).redirectErrorStream(true)
        builder.environment().put('STRIDE_STORE_PASSWORD', storePassword.toString())
        def process = builder.start()
        def output = process.inputStream.getText('UTF-8')
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("keytool could not read ${storePath}:\n${output}")
        }
        def matcher = (output =~ /SHA256:\s*([0-9A-Fa-f:]+)/)
        if (!matcher.find()) {
            throw new GradleException("No SHA256 fingerprint in the signing certificate:\n${output}")
        }
        def actual = matcher.group(1).replace(':', '').toUpperCase()
        if (!fingerprints.contains(actual)) {
            throw new GradleException(
                    "The signing certificate (${actual}) is not the one published in " +
                    "${assetLinks} (${fingerprints.join(', ')}).\n" +
                    'The app would open as a browser tab instead of a real app. ' +
                    'Either publish the right fingerprint or sign with the published key.')
        }
        logger.lifecycle("verifyAssetLinksFingerprint: ${actual} matches ${assetLinks.name}.")
    }
}

tasks.matching { it.name == 'preReleaseBuild' || it.name == 'assembleRelease' }.configureEach {
    dependsOn 'verifyAssetLinksFingerprint'
}

android {
    if (haveSigningKey) {
        signingConfigs {
            create('stride') {
                storeFile file(signingProps['storePath'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    namespace = "app.stride.running"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.stride.running"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The version comes from the release tag, so the APK on the phone
        // and the release it came from always agree.
        versionCode (project.hasProperty('strideVersionCode') ? project.strideVersionCode.toInteger() : 1)
        versionName (project.hasProperty('strideVersionName') ? project.strideVersionName : '1.0.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // One ABI. The release APK has to stay under 10 MB, and the phone
        // is arm64.
        ndk {
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            // The Kotlin bindings UniFFI generates.
            java.srcDirs += uniffiGeneratedDir
            // The Rust core, as a shared object.
            jniLibs.srcDirs += rustJniLibsDir
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (haveSigningKey) {
                signingConfig signingConfigs.getByName('stride')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"

    // The background pull. WorkManager survives the app being killed, and
    // its constraints are the honest ones.
    implementation "androidx.work:work-runtime-ktx:2.10.1"

    // UniFFI's Kotlin bindings call the Rust core through JNA. The AAR is
    // the Android build of JNA; it adds about a megabyte to the APK, which
    // is the price of not hand-writing a JNI layer.
    implementation("net.java.dev.jna:jna:5.17.0@aar")

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
