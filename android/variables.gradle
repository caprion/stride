// The versions the phone shell builds against.
//
// **The floor is Android 15 (API 35)**, and it is not an arbitrary choice:
// the Keystore keys are created with `setUnlockedDeviceRequired(true)`, and
// on Android 12 to 14 the platform does not enforce that flag the way the
// documentation says it does. The whole promise of the key store — "a
// locked phone cannot unwrap the Garmin key" — is only true from API 35 on.
// A phone that cannot keep that promise does not get the app.
//
// The ceiling is the platform the store requires at the time of the release;
// it is a number in this file and nothing else.
ext {
    minSdkVersion = 35
    compileSdkVersion = 36
    targetSdkVersion = 36

    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    androidxWebkitVersion = '1.14.0'
    androidxBiometricVersion = '1.1.0'
    androidxBrowserVersion = '1.8.0'
    androidxWorkVersion = '2.10.1'
    jnaVersion = '5.17.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
}
