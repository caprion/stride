<!doctype html>
<!--
  The palette is one attribute on the root element: `data-palette`. The
  app sets it from the athlete's choice before the first paint, and the
  colours below are the variables it swaps.
-->
<html lang="en" data-palette="stride">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D3A63" />
    <title>Stride</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
