apply plugin: 'com.android.application'

// The phone's shell is Kotlin: the bridge, the Keystore, the worker and the
// notifications.
apply plugin: 'org.jetbrains.kotlin.android'

// ---------------------------------------------------------------------------
// The Rust core.
//
// The phone runs the Rust core **in this process**: `cargo-ndk` builds it
// for `aarch64-linux-android`, UniFFI generates the Kotlin bindings from the
// UDL, and the shared object is packaged as `libuniffi_stride.so`.
//
// **arm64-v8a only.** Almost every phone in use is arm64, and the release
// APK has to stay under 10 MB; a second ABI would take ~2.2 MB of that.
// ---------------------------------------------------------------------------

/**
 * The ABIs this build carries.
 *
 * **arm64-v8a only**, which is what ships: almost every phone in use is
 * arm64, and the release APK has to stay under 10 MB. The x86_64 variant
 * exists for the emulator and is never published — it is a debug build, and
 * it is what the acceptance test runs on.
 *
 *     ./gradlew :app:assembleDebug -PstrideEmulatorAbi=x86_64
 */
def targetAbis = project.hasProperty('strideEmulatorAbi')
        ? [project.strideEmulatorAbi]
        : ['arm64-v8a']

/** The Rust workspace of the phone. */
def rustCrateDir = file('src/main/rust/stride-ffi')

/** Where the generated Kotlin bindings go. */
def uniffiGeneratedDir = layout.buildDirectory.dir('generated/uniffi/kotlin')

/** Where the shared object is staged for the APK. */
def rustJniLibsDir = layout.buildDirectory.dir('rust/jniLibs')

/**
 * The Rust target triple of an ABI.
 *
 * `cargo-ndk` builds into `target/<triple>/release`, and the triple is not
 * the ABI name: `arm64-v8a` is `aarch64-linux-android`.
 */
/**
 * The Rust workspace's target directory.
 *
 * `rootProject.projectDir` is the *android* directory - the Gradle root - and
 * the Rust workspace is the repository root above it. The cross-compiled
 * library lands in the workspace's target directory, not in android/target.
 */
def rustWorkspaceDir = rootProject.projectDir.parentFile

def rustTriple = { abi ->
    switch (abi) {
        case 'arm64-v8a': return 'aarch64-linux-android'
        case 'x86_64': return 'x86_64-linux-android'
        case 'armeabi-v7a': return 'armv7-linux-androideabi'
        default: return null
    }
}

/**
 * Where `cargo-ndk` leaves the cross-compiled artefacts.
 *
 * The phone's crate is a member of the root workspace, so cargo builds into
 * the *workspace's* target directory, not the crate's own. The crate's own
 * directory is still checked first, because a crate built on its own - with
 * `cargo ndk` run from inside it - leaves the artefacts there instead.
 */


/** The Android SDK, from `local.properties` or the environment. */
def androidSdkDir = {
    def properties = new Properties()
    def local = rootProject.file('local.properties')
    if (local.exists()) {
        local.withInputStream { properties.load(it) }
    }
    def dir = properties.getProperty('sdk.dir')
    if (!dir) dir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    return dir ? file(dir).absolutePath : null
}()

/** The NDK, from the environment or from the SDK. */
def androidNdkDir = {
    if (System.getenv('ANDROID_NDK_HOME')) return System.getenv('ANDROID_NDK_HOME')
    if (!androidSdkDir) return null
    def root = new File(androidSdkDir, 'ndk')
    if (!root.exists()) return null
    def versions = (root.listFiles() ?: []).findAll { it.directory }.sort { it.name }
    return versions.isEmpty() ? null : versions.last().absolutePath
}()

/**
 * Generate the Kotlin bindings for the Rust core.
 *
 * UniFFI's CLI is not published as a binary for this version, so the build
 * uses the generator as a library: `stride-bindgen` is a small crate in
 * `src/main/rust/stride-bindgen` that writes the bindings into the build
 * directory.
 */
tasks.register('uniffiGenerateKotlin', Exec) {
    group = 'stride'
    description = 'Generates the Kotlin bindings for the Rust core.'
    workingDir rustCrateDir
    commandLine 'cargo', 'run', '--release', '--manifest-path', 'stride-bindgen/Cargo.toml',
            '--', 'src/stride.udl', uniffiGeneratedDir.get().asFile.absolutePath
    inputs.file file('src/main/rust/stride-ffi/src/stride.udl')
    outputs.dir uniffiGeneratedDir
}

/**
 * Build the Rust core for the phone.
 *
 * `cargo-ndk` cross-compiles for `aarch64-linux-android`. The artefacts stay
 * in the cargo target directory: only `libuniffi_stride.so` is packaged, so
 * the shared objects of the path dependencies (`libstride_api.so`) do not
 * ride along.
 */
tasks.register('cargoNdkBuild', Exec) {
    group = 'stride'
    description = 'Builds the Rust core for aarch64-linux-android.'
    dependsOn 'uniffiGenerateKotlin'
    workingDir rustCrateDir
    commandLine 'cargo', 'ndk', '-t', targetAbis.join(','),
            'build', '--release', '--manifest-path', 'Cargo.toml'
    if (androidNdkDir) {
        environment 'ANDROID_NDK_HOME', androidNdkDir
        environment 'ANDROID_NDK_ROOT', androidNdkDir
    }
    inputs.dir file('src/main/rust/stride-ffi/src')
    inputs.file file('src/main/rust/stride-ffi/Cargo.toml')
    // The shared crates are inputs too. The phone's crate is a member of
    // the root workspace, so a change in `crates/` changes the library that
    // goes into the APK - and Gradle hashes what a task declares, not what
    // the shell it happens to run reads. Without these the build packages
    // a core that is a version behind the one the tests ran against.
    inputs.dir file("${rustWorkspaceDir}/crates")
    inputs.file file("${rustWorkspaceDir}/Cargo.lock")
    inputs.property('abi', targetAbis[0])
    // The stamp lives in the build directory, **not** in the cargo target
    // directory: Gradle deletes a task's previous outputs when it re-runs
    // the task, and the cargo target directory belongs to cargo. Declaring it
    // as an output once wiped the phone's own build when the emulator
    // variant was built.
    outputs.file layout.buildDirectory.file("rust/cargo-ndk-${targetAbis[0]}.stamp")
}

/**
 * Put the core's shared object where the APK picks it up.
 *
 * This is a plain task with the copy in its action, not a `Copy` task with a
 * `from(...)`: Gradle resolves a Copy task's sources while it works out the
 * task graph, which is *before* cargo-ndk has built anything. The lookup has
 * to happen inside the action, where the library exists.
 */
tasks.register('copyRustLibrary') {
    group = 'stride'
    description = 'Packages the Rust core as lib/arm64-v8a/libuniffi_stride.so.'
    dependsOn 'cargoNdkBuild'
    // The ABI is an input: a build for the emulator and a build for a phone
    // are different packages, and the task has to know which one it is
    // packaging. Without this the copy is considered up to date after the
    // ABI changes, and the APK ships without the core in it.
    inputs.property('abi', targetAbis[0])
    // **The library itself is an input.** Without this Gradle asks only
    // whether the ABI changed, finds that it did not, and considers the copy
    // up to date - so a cargo rebuild is invisible to it and the APK ships
    // the core from an earlier build. The build succeeds, the app runs, and
    // it is the wrong code.
    inputs.files(fileTree(rustWorkspaceDir) {
        include "target/${rustTriple(targetAbis[0])}/release/libuniffi_stride.so"
    })
    inputs.files(fileTree("src/main/rust/stride-ffi") {
        include "target/${rustTriple(targetAbis[0])}/release/libuniffi_stride.so"
    })
    outputs.dir new File(rustJniLibsDir.get().asFile, targetAbis[0])
    doLast {
        def triple = rustTriple(targetAbis[0])
        def candidates = [
                file("src/main/rust/stride-ffi/target/${triple}/release"),
                file("${rustWorkspaceDir}/target/${triple}/release"),
        ]
        def source = candidates.find { new File(it, 'libuniffi_stride.so').exists() }
        if (!source) {
            throw new GradleException(
                    "cargo-ndk has not built ${triple}. Looked in:\n  " +
                    candidates.collect { it.absolutePath }.join("\n  "))
        }
        // Only the core's own library ships. A shared object left over from
        // an earlier build — `libstride_api.so`, say — would be packaged
        // beside it and the app would carry a megabyte it never loads.
        delete rustJniLibsDir
        def destination = new File(rustJniLibsDir.get().asFile, targetAbis[0])
        destination.mkdirs()
        copy {
            from new File(source, 'libuniffi_stride.so')
            into destination
        }
        logger.lifecycle("packaged the Rust core: ${source}/libuniffi_stride.so")
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'copyRustLibrary'
}

// Release signing.
//
// The keystore never lives in the repository. In CI it comes from a secret;
// on a developer's machine it comes from keystore.properties in this
// directory, which is git-ignored.
//
// The matching *certificate* is public and is committed, in
// backend/app/assetlinks.json — that is what lets the app verify this
// origin and open as a real app rather than a browser tab.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def haveSigningKey = signingProps.containsKey('storePath')

// The published fingerprint has to be the fingerprint of the key the APK is
// actually signed with. When the two drift, Digital Asset Links stops
// matching and the Trusted Web Activity quietly degrades into a browser tab
// with a web page in it, which looks like a broken app rather than a broken
// signature and is easy to miss. So the release build checks it.
//
// The check reads the certificate out of the keystore with keytool; the
// password is handed over in the environment rather than on the command
// line, where it would be visible in the process table.
tasks.register('verifyAssetLinksFingerprint') {
    doLast {
        def assetLinks = project.rootProject.file('../backend/app/assetlinks.json')
        if (!assetLinks.exists()) {
            throw new GradleException("Missing ${assetLinks}: the published asset links file is required.")
        }
        def published = new groovy.json.JsonSlurper().parse(assetLinks, 'UTF-8')
        def packageNames = [] as Set
        def fingerprints = [] as Set
        published.each { entry ->
            def target = entry['target'] ?: [:]
            if (target['package_name']) {
                packageNames << target['package_name'].toString()
            }
            (target['sha256_cert_fingerprints'] ?: []).each { fp ->
                fingerprints << fp.toString().replace(':', '').toUpperCase()
            }
        }
        if (!fingerprints) {
            throw new GradleException("${assetLinks} publishes no sha256_cert_fingerprints.")
        }
        if (!packageNames.contains('app.stride.running')) {
            throw new GradleException("${assetLinks} does not name the package app.stride.running (found ${packageNames}).")
        }
        if (!haveSigningKey) {
            logger.lifecycle('verifyAssetLinksFingerprint: no signing key configured, nothing to verify against.')
            return
        }

        def storePassword = signingProps['storePassword']
        if (!storePassword) {
            throw new GradleException('keystore.properties has no storePassword.')
        }
        def storePath = project.file(signingProps['storePath']).absolutePath
        if (!new File(storePath).exists()) {
            throw new GradleException("Signing keystore ${storePath} does not exist.")
        }
        def builder = new ProcessBuilder([
                'keytool', '-list', '-v',
                '-keystore', storePath,
                '-alias', signingProps['keyAlias'],
                '-storepass:env', 'STRIDE_STORE_PASSWORD',
        ]).redirectErrorStream(true)
        builder.environment().put('STRIDE_STORE_PASSWORD', storePassword.toString())
        def process = builder.start()
        def output = process.inputStream.getText('UTF-8')
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("keytool could not read ${storePath}:\n${output}")
        }
        def matcher = (output =~ /SHA256:\s*([0-9A-Fa-f:]+)/)
        if (!matcher.find()) {
            throw new GradleException("No SHA256 fingerprint in the signing certificate:\n${output}")
        }
        def actual = matcher.group(1).replace(':', '').toUpperCase()
        if (!fingerprints.contains(actual)) {
            throw new GradleException(
                    "The signing certificate (${actual}) is not the one published in " +
                    "${assetLinks} (${fingerprints.join(', ')}).\n" +
                    'The app would open as a browser tab instead of a real app. ' +
                    'Either publish the right fingerprint or sign with the published key.')
        }
        logger.lifecycle("verifyAssetLinksFingerprint: ${actual} matches ${assetLinks.name}.")
    }
}

tasks.matching { it.name == 'preReleaseBuild' || it.name == 'assembleRelease' }.configureEach {
    dependsOn 'verifyAssetLinksFingerprint'
}

android {
    if (haveSigningKey) {
        signingConfigs {
            create('stride') {
                storeFile file(signingProps['storePath'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    namespace = "app.stride.running"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.stride.running"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The version comes from the release tag, so the APK on the phone
        // and the release it came from always agree.
        versionCode (project.hasProperty('strideVersionCode') ? project.strideVersionCode.toInteger() : 1)
        versionName (project.hasProperty('strideVersionName') ? project.strideVersionName : '1.0.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // One ABI in the release build; the emulator variant asks for its
        // own.
        ndk {
            abiFilters(*targetAbis)
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            // The Kotlin bindings UniFFI generates.
            java.srcDirs += uniffiGeneratedDir
            // The Rust core, as a shared object.
            jniLibs.srcDirs += rustJniLibsDir
        }
    }
    packaging {
        jniLibs {
            // The native libraries are compressed in the APK.
            //
            // The budget is the APK: the Rust core is nine megabytes of
            // encrypted database and TLS, and a stored (uncompressed) shared
            // object would put the download over the ten megabyte limit on
            // its own. Compressed, the APK is under it. The phone extracts
            // the library at install time, which is what the loader expects.
            useLegacyPackaging true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (haveSigningKey) {
                signingConfig signingConfigs.getByName('stride')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"

    // The background pull. WorkManager survives the app being killed, and
    // its constraints are the honest ones.
    implementation "androidx.work:work-runtime-ktx:2.10.1"

    // The app gate asks the phone for its own credential. The platform's
    // BiometricPrompt lost the pieces this needs in the API 36 platform, so
    // the prompt is AndroidX's — which is what the platform API turned into.
    implementation "androidx.biometric:biometric:1.1.0"

    // The Garmin key page opens in a **Custom Tab**: a browser tab that is
    // part of this app's task, so the athlete closes it and comes straight
    // back to the field they were filling in.
    //
    // There is no platform API for this: the Custom Tabs protocol is a set
    // of extras on an intent, and the only supported way to use it is this
    // library. Without it the screen would have to use a plain ACTION_VIEW,
    // which sends the athlete out to a browser they then have to find their
    // way back from — and the field is empty when they get there.
    implementation "androidx.browser:browser:1.8.0"

    // UniFFI's Kotlin bindings call the Rust core through JNA. The AAR is
    // the Android build of JNA; it adds about a megabyte to the APK, which
    // is the price of not hand-writing a JNI layer.
    implementation("net.java.dev.jna:jna:5.17.0@aar")

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
