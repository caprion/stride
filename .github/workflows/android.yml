name: android

# Builds the Android app and, on a tag, publishes the APK as a release
# asset so anyone can download it from the Releases page — no store, no
# account, no review queue.
#
# The APK is signed with a key that lives only in the repository secrets.
# The matching *certificate* is public and committed, in
# backend/app/assetlinks.json, which is what lets the app open the web app
# as a real app instead of a browser tab.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend tests and the security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix frontend ci
      - name: Tests
        run: cd backend && python -m pytest -q
      - name: Security gate
        run: ./scripts/security_check.sh

  apk:
    name: Build the APK
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_name }}

      - name: Install the node modules
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Fetch the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keys/stride.jks"
          cat > android/keystore.properties <<EOF
          storePath=$RUNNER_TEMP/keys/stride.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=stride
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Restore the web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Sync the web app into the Android project
        run: npx cap sync android

      - name: Accept the Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/stride-${{ github.ref_name }}.apk" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/app-release.apk dist/stride.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          retention-days: 30

  release:
    name: Publish the release
    needs: [apk, backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Stride for Android

            Download the APK below, install it, and open Stride.

            The app is served by **your own instance** — Stride has no cloud
            and no account. If you are running Stride yourself, point the app
            at your machine; if you are trying it, see the README.

            ### Installing

            1. Download `stride-*.apk` to the phone.
            2. Open it and allow installs from this source.
            3. Launch Stride. On first run it asks for a pairing code — run
               `./scripts/prod.sh pair` on the machine running Stride and
               type the code in.

            The APK is signed with a key whose certificate is published in
            `backend/app/assetlinks.json`, so the app opens the web app as a
            real app rather than a browser tab.
